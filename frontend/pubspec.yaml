name: activity_tracker
description: Personal daily activity tracker with optional AI assistant.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  http: ^1.1.0
  shared_preferences: ^2.1.1
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  lottie: ^2.6.0
  table_calendar: ^3.0.9
  percent_indicator: ^4.1.1
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.0
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
